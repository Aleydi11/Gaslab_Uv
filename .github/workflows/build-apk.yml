name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generar carpetas de plataforma
        run: flutter create . --project-name gaslab_uv --org mx.uv.gaslab --platforms=android,ios

      - name: Conservar el código fuente del repositorio
        run: git checkout -- lib test pubspec.yaml analysis_options.yaml

      - name: Nombre visible de la app en Android
        run: sed -i 's/android:label="[^"]*"/android:label="GASLAB UV"/' android/app/src/main/AndroidManifest.xml

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: gaslab-uv-apk
          path: build/app/outputs/flutter-apk/app-release.apk
